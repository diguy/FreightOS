services:
  mysql:
    image: mysql:8.0
    command: --max-connections=1000
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ragflow_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ragflow}
      MYSQL_USER: ${MYSQL_USER:-ragflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ragflow}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ragflow_mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ragflow_redis:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ragflow_minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ragflow_minio:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - ragflow_elasticsearch:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  ragflow_mysql:
  ragflow_redis:
  ragflow_minio:
  ragflow_elasticsearch:
