[project]
name = "backend-lab"
version = "0.1.0"
description = "Backend learning project"
authors = [
    {name = "Ross",email = "3468339166@qq.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "python-docx (>=1.1.2,<2.0.0)",
    "pypdf (>=5.0.0,<6.0.0)"
    ,"redis (>=5.0.0,<6.0.0)",
    "pymysql (>=1.1.0,<2.0.0)",
    "mcp (==2.1.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
markers = [
    "integration: crosses process or external service boundaries",
]
pythonpath = ["."]
